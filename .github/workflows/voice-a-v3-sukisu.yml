# Voice-A v3 Kernel (camellia) — SukiSU-Ultra root, same Flyme base as v1/v2
#
# Builds the user's own fork of the Flyme kernel (HIZVOICE/Voice-A,
# 4.14.357-openela-rc1, stock clocks, camellia_defconfig) with the
# vendored ReSukiSU driver replaced by SukiSU-Ultra main @ v4.3.0-r2
# (KSU_VERSION 41150 = 40000 + 3965 - 2815), so the SukiSU-Ultra
# manager (v4.3.0-r2 release APK, 41150, com.sukisu.ultra) works with
# this driver. The kernel is branded Voice-A (CONFIG_LOCALVERSION
# "-flyme" -> "-Voice-A").
#
# v3 is the ROOT BAKE-OFF variant 3: same base as v1/v2, root stack as the
# only variable. SukiSU-Ultra main hooks via kprobes + the sys_enter
# tracepoint (registered at runtime); there is no hook-backend Kconfig
# choice (CONFIG_KSU_MANUAL_HOOK / CONFIG_KSU_TRACEPOINT_HOOK do not
# exist in SukiSU-Ultra). SUSFS stays OFF and KPM stays OFF (round-1
# rule); the susfs_extension.o that ships in main is the SUSFS
# *management* layer, inert on a kernel without the SUSFS patch — do
# NOT assert "SUSFS strings == 0" (unlike v2). The manager signature
# is a single v2 check (size 0x35c, hash 947ae9...), not FinaSU's slot-2
# pair. Perf features land one at a time in later builds, so any
# regression traces to exactly one change.
#
# 4.14 COMPAT PATCH — WRITTEN 2026-11-09 (v3-compat-4.14.patch, 30 files,
# 802 insertions, validated: git apply --check clean on a fresh tag clone,
# bit-identical tree). Step 5c applies it. SukiSU-Ultra officially supports
# 4.14+ (README minimum 4.14, manual build route), but its driver source is
# written for 5.10+ in the same places FinaSU was. The patch carries the
# FinaSU v2 bootloop lesson: the three direct table hooks (ksu_sys_read,
# ksu_sys_fstat, ksu_syscall_dispatcher) are reworked for the 4.14 calling
# convention (direct args, not pt_regs), plus preinit clone3 -> clone and
# the SELinux policy ports. Research:
# ~/workspace/kernel-camellia/voice-a/sukisu-ultra-research.md
# Patch: ~/workspace/kernel-camellia/voice-a/v3-compat-4.14.patch
#
# Pins — kernel/clang/AK3 same as proven v1/v2; driver pin verified 2026-11-09:
#   kernel: HIZVOICE/Voice-A (fork of Artslon/kernel_xiaomi_mt6833)
#           @ bae2187f48937b130933b67914e53bb5d79a4b65 (the fork point)
#   driver: SukiSU-Ultra/SukiSU-Ultra @ v4.3.0-r2
#           645ef9860b9b7f900bb5d1b27e224f2c311d39c0
#           (3965 commits at tag -> KSU_VERSION = 40000 + 3965 - 2815
#           = 41150; release 2026-11-05)
#   manager: SukiSU v4.3.0-r2 release APK, version 41150, 20,131,351 B,
#           package com.sukisu.ultra, sha256 to be recorded on first
#           download (signature size 0x35c, hash
#           947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef)
#   clang:  AOSP clang-r547379 = Clang 20.0.0 (verified 200 OK)
#   ak3:    osm0sis/AnyKernel3 @ e4b1bb25ca2aabcfd57f694a5998d87130701b71
#           (AK_BASE_VERSION=20260809 — byte-identical scaffold to the v6 zip)
#
# Trigger: manual only (workflow_dispatch). Nothing is flashed here;
# the output is a flashable AnyKernel3 zip (artifact + GitHub Release).

name: Voice-A v3 Kernel (SukiSU-Ultra, camellia)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_SHA: bae2187f48937b130933b67914e53bb5d79a4b65
  SUKISU_TAG: v4.3.0-r2
  SUKISU_SHA: 645ef9860b9b7f900bb5d1b27e224f2c311d39c0
  SUKISU_COMMITS: "3965"
  KSU_VERSION: "41150"
  KSU_EXPECTED_SIZE: "0x35c"
  KSU_EXPECTED_HASH: "947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef"
  KSU_PACKAGE_NAME: com.sukisu.ultra
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
  AK3_SHA: e4b1bb25ca2aabcfd57f694a5998d87130701b71
  ZIP_NAME: AnyKernel3-camellia-Voice-A-v3-SukiSU.zip
  RELEASE_TAG: voice-a-v3

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: 1. Install build dependencies
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 git curl zip unzip cpio rsync
          nproc
          df -h .

      - name: 2. Download pinned AOSP Clang r547379 (Clang 20.0.0)
        run: |
          set -eo pipefail
          mkdir -p "$HOME/clang"
          curl -fsSL "$CLANG_URL" -o /tmp/clang-r547379.tar.gz
          tar -xzf /tmp/clang-r547379.tar.gz -C "$HOME/clang"
          "$HOME/clang/bin/clang" --version | head -1
          test -x "$HOME/clang/bin/clang"

      - name: 3. Clone Voice-A fork @ pinned SHA
        run: |
          set -eo pipefail
          # Fetch the pinned commit explicitly. A plain `--depth 1` clone
          # of main can never satisfy the pin: committing this workflow
          # moves the tip past it (build #2 died on exactly that — the
          # clone fetched the new tip 1812805 and the check wanted 7b63adb).
          # GitHub serves a fetch of a commit SHA that is reachable from a
          # ref, and bae2187 is the fork point on main.
          # Retry up to 3 times: build #1's clone died on a transient pack
          # read ('error: bad pack offset', exit 128) after fetching all
          # 79,527 objects — a fetch failure, not a repo problem.
          for attempt in 1 2 3; do
            rm -rf kernel
            git init -q kernel
            git -C kernel remote add origin https://github.com/HIZVOICE/Voice-A.git
            if git -C kernel fetch --depth 1 origin "$KERNEL_SHA"; then
              break
            fi
            echo "fetch attempt $attempt failed, retrying..."
            sleep 10
          done
          git -C kernel rev-parse --verify -q FETCH_HEAD >/dev/null || { echo "ERROR: fetch of $KERNEL_SHA failed after 3 attempts"; exit 1; }
          git -C kernel checkout -q FETCH_HEAD
          HEAD_SHA="$(git -C kernel rev-parse HEAD)"
          echo "kernel HEAD: $HEAD_SHA"
          [ "$HEAD_SHA" = "$KERNEL_SHA" ] || { echo "ERROR: kernel HEAD is not the pinned $KERNEL_SHA"; exit 1; }

      - name: 4. Replace vendored driver with SukiSU-Ultra @ v4.3.0-r2
        run: |
          set -eo pipefail
          rm -rf kernel/KernelSU
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git kernel/KernelSU
          git -C kernel/KernelSU checkout -b build "$SUKISU_SHA"
          COUNT="$(git -C kernel/KernelSU rev-list --count HEAD)"
          echo "SukiSU-Ultra commit count: $COUNT (expect $SUKISU_COMMITS)"
          [ "$COUNT" = "$SUKISU_COMMITS" ] || { echo "ERROR: commit count mismatch"; exit 1; }
          # Kbuild: KSU_VERSION = 40000 + rev-list count - 2815 = 41150.
          # (NOT FinaSU's 30000 + count.) Verify the arithmetic here so a
          # wrong pin cannot silently pair with the wrong manager APK.
          CALC="$((40000 + COUNT - 2815))"
          echo "KSU_VERSION computes to: $CALC (expect $KSU_VERSION)"
          [ "$CALC" = "$KSU_VERSION" ] || { echo "ERROR: KSU_VERSION mismatch"; exit 1; }
          git -C kernel/KernelSU describe --tags --exact-match HEAD || echo "WARNING: HEAD is not exactly at tag $SUKISU_TAG (version-full will differ)"
          test -L kernel/drivers/kernelsu
          echo "drivers/kernelsu -> $(readlink kernel/drivers/kernelsu)"
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' kernel/drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig
          grep -q '^CONFIG_KSU=y$' kernel/arch/arm64/configs/camellia_defconfig
          echo "driver wiring OK (symlink + Makefile + Kconfig + defconfig)"

      - name: 5. Brand the kernel Voice-A (LOCALVERSION -flyme -> -Voice-A)
        run: |
          set -eo pipefail
          grep -q '^CONFIG_LOCALVERSION="-flyme"$' kernel/arch/arm64/configs/camellia_defconfig || { echo "ERROR: expected CONFIG_LOCALVERSION=\"-flyme\" in camellia_defconfig"; exit 1; }
          sed -i 's/^CONFIG_LOCALVERSION="-flyme"$/CONFIG_LOCALVERSION="-Voice-A"/' kernel/arch/arm64/configs/camellia_defconfig
          grep -q '^CONFIG_LOCALVERSION="-Voice-A"$' kernel/arch/arm64/configs/camellia_defconfig || { echo "ERROR: LOCALVERSION did not change to -Voice-A"; exit 1; }
          echo "LOCALVERSION is now -Voice-A (banner will read 4.14.357-openela-rc1-Voice-A)"

      - name: 5b. SukiSU-Ultra config — drop the BakaSU hook symbol, EXT4_FS explicit
        run: |
          set -eo pipefail
          # SukiSU-Ultra has NO hook-backend Kconfig choice: its main branch
          # hooks via kprobes + the sys_enter tracepoint, and
          # CONFIG_KSU_MANUAL_HOOK / CONFIG_KSU_TRACEPOINT_HOOK do not
          # exist in either branch. The Flyme defconfig still carries the
          # BakaSU symbol from v1's base, so delete it outright.
          # KSU_MANUAL_SU defaults y and KPM defaults n in SukiSU-Ultra's
          # Kconfig — both correct as-is, nothing to append for them.
          sed -i '/^CONFIG_KSU_MANUAL_HOOK=y$/d' kernel/arch/arm64/configs/camellia_defconfig
          printf 'CONFIG_EXT4_FS=y\n' >> kernel/arch/arm64/configs/camellia_defconfig
          grep -q '^CONFIG_KSU=y$' kernel/arch/arm64/configs/camellia_defconfig
          grep -q '^CONFIG_EXT4_FS=y$' kernel/arch/arm64/configs/camellia_defconfig
          grep -q '^CONFIG_KALLSYMS_ALL=y$' kernel/arch/arm64/configs/camellia_defconfig
          ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' kernel/arch/arm64/configs/camellia_defconfig || { echo "ERROR: CONFIG_KSU_MANUAL_HOOK still present"; exit 1; }
          ! grep -q '^CONFIG_KPM=y$' kernel/arch/arm64/configs/camellia_defconfig || { echo "ERROR: CONFIG_KPM is on (must stay off, round-1 rule)"; exit 1; }
          echo "SukiSU-Ultra config OK (KSU + EXT4_FS + KALLSYMS_ALL, no MANUAL_HOOK, KPM off)"

      - name: 5c. Apply 4.14 compat patch (v3-compat-4.14.patch)
        run: |
          set -eo pipefail
          # SukiSU-Ultra v4.3.0-r2 -> 4.14 compat patch (30 files, 802
          # insertions, validated: git apply --check clean on a fresh tag
          # clone, bit-identical tree). Version-gated, minimal, C-only.
          # Includes the FinaSU v2 bootloop lesson: the three direct table
          # hooks (ksu_sys_read, ksu_sys_fstat, ksu_syscall_dispatcher)
          # are reworked for the 4.14 calling convention (direct args,
          # not pt_regs), plus preinit clone3 -> clone and the SELinux
          # policy ports. Patch lives in HIZVOICE/Voice-A as
          # v3-compat-4.14.patch.
          curl -fsSL https://raw.githubusercontent.com/HIZVOICE/Voice-A/main/v3-compat-4.14.patch -o /tmp/v3-compat-4.14.patch
          git -C kernel/KernelSU apply /tmp/v3-compat-4.14.patch
          git -C kernel/KernelSU diff --stat

      - name: 6. Build Image.gz-dtb (camellia_defconfig, stock clocks)
        run: |
          set -eo pipefail
          cd kernel
          export PATH="$HOME/clang/bin:$PATH"
          export KBUILD_BUILD_USER=HIZVOICE
          export KBUILD_BUILD_HOST=camellia
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" camellia_defconfig 2>&1 | tee "$GITHUB_WORKSPACE/defconfig.log"
          # SukiSU-Ultra preinit is conditional on the UAPI headers existing
          # (Kbuild gates preinit.o/blob.o on $(wildcard $(KSU_UAPI_INC)/linux/unistd.h));
          # a plain Image build does not populate them on 4.14. There is no
          # KSU_REQUIRE_PREINIT variable in SukiSU-Ultra — instead the build
          # log is grepped for preinit.o/blob.o below, so a build with
          # preinit silently off fails the verify step.
          make O=out ARCH=arm64 headers_install 2>&1 | tee "$GITHUB_WORKSPACE/headers_install.log"
          test -f out/usr/include/linux/unistd.h || { echo "ERROR: headers_install did not produce out/usr/include/linux/unistd.h"; exit 1; }
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" \
            KSU_EXPECTED_SIZE="$KSU_EXPECTED_SIZE" \
            KSU_EXPECTED_HASH="$KSU_EXPECTED_HASH" \
            Image.gz-dtb 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: 7. VERIFY — gate, stops the job before packaging on any failure
        run: |
          set -eo pipefail
          grep -F "SukiSU-Ultra version: $KSU_VERSION" build.log || { echo "ERROR: Kbuild did not report SukiSU-Ultra version $KSU_VERSION"; exit 1; }
          grep -F "preinit/preinit.o" build.log || { echo "ERROR: preinit.o not in build log (preinit is off — headers_install did not take)"; exit 1; }
          grep -F "preinit/blob.o" build.log || { echo "ERROR: blob.o not in build log (preinit is off)"; exit 1; }
          # .config gates: KSU + EXT4_FS + KALLSYMS_ALL on, KPM off.
          grep -q '^CONFIG_KSU=y$' kernel/out/.config
          grep -q '^CONFIG_EXT4_FS=y$' kernel/out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' kernel/out/.config
          ! grep -q '^CONFIG_KPM=y$' kernel/out/.config || { echo "ERROR: CONFIG_KPM is on (must stay off, round-1 rule)"; exit 1; }
          echo ".config gates OK (KSU + EXT4_FS + KALLSYMS_ALL, KPM off)"
          python3 - <<'PYEOF'
          import re, zlib
          p = "kernel/out/arch/arm64/boot/Image.gz-dtb"
          data = open(p, "rb").read()
          print(f"Image.gz-dtb size: {len(data)} bytes")
          best = b""
          i = 0
          while True:
              j = data.find(b"\x1f\x8b\x08", i)
              if j < 0:
                  break
              try:
                  d = zlib.decompressobj(31)
                  out = d.decompress(data[j:])
                  if len(out) > len(best):
                      best = out
              except Exception:
                  pass
              i = j + 1
          assert best, "no gzip stream found in Image.gz-dtb"
          m = re.search(rb"Linux version [ -~]{10,140}", best)
          assert m, "kernel banner not found in decompressed image"
          banner = m.group(0).decode()
          print("banner:", banner)
          assert "4.14.357-openela-rc1-Voice-A (HIZVOICE@camellia)" in banner, "banner mismatch: wrong version/user/host"
          ksu = best.count(b"KernelSU")
          print("KernelSU string hits:", ksu)
          assert ksu > 100, "too few KernelSU strings"
          # NOTE: do NOT assert SUSFS strings == 0 here (unlike v2).
          # SukiSU-Ultra main compiles extension/susfs_extension.o
          # unconditionally, but it is the SUSFS *management* layer
          # (inert without the SUSFS kernel patch, which is not in this
          # tree). Its strings are present by design.
          print("SukiSU-Ultra string hits:", best.count(b"SukiSU"))
          print("ALL IMAGE CHECKS PASSED")
          PYEOF

      - name: 8. Package AnyKernel3 zip (modelled on verified v6)
        run: |
          set -eo pipefail
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          git -C ak3 checkout "$AK3_SHA"
          rm -rf ak3/.git
          mkdir -p pkg
          cp -a ak3/. pkg/
          cat > pkg/anykernel.sh <<'AK3_EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Voice-A v3 — camellia 4.14.357, SukiSU-Ultra 41150, stock clocks
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=camellia
          device.name2=camellian
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties


          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot; # skip unpack/repack ramdisk - kernel image contains appended dtb

          flash_boot;
          ## end boot install
          AK3_EOF
          cp kernel/out/arch/arm64/boot/Image.gz-dtb pkg/Image.gz-dtb
          cd pkg
          zip -r -y "../$ZIP_NAME" .
          cd ..
          unzip -l "$ZIP_NAME"
          sha256sum "$ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: 9. Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: 10. Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          # NOTE: this workflow never checks out the repo (no actions/checkout),
          # so the workspace is not a git repo and `gh` cannot infer the
          # repository from a remote. Pass it explicitly (the BakaSU rebuild
          # failed here once: "fatal: not a git repository").
          gh release create "$RELEASE_TAG" "$ZIP_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Voice-A v3 — SukiSU-Ultra 41150" \
            --notes "Voice-A v3: the same Flyme kernel base as v1/v2 (4.14.357-openela-rc1, stock clocks, camellia_defconfig) with the root driver swapped to SukiSU-Ultra main @ v4.3.0-r2 (KSU_VERSION 41150) from upstream SukiSU-Ultra/SukiSU-Ultra. Kprobes + sys_enter tracepoint hooks (main branch); SUSFS and KPM off. The manager signature is baked in (size 0x35c, hash 947ae9...), so the SukiSU v4.3.0-r2 manager APK (41150, com.sukisu.ultra) is recognised — install that exact release APK on the phone. Preinit on. Built with AOSP Clang r547379 (20.0.0). Packaged with AnyKernel3 @ e4b1bb2 (same scaffold as the verified v6 zip). Flash via recovery. This is bake-off variant 3 — same base as v1/v2, root stack as the only variable."
